[project]
name = "shangrilla-rag"
version = "0.1.0"
description = "Enterprise RAG chatbot over Shangrilla Foods SAP FSD/TSD documentation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "google-genai>=1.0",
    "openai>=1.50",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "chainlit>=2.0",
]

# All milestone dependencies now in place.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.2",  # test-only: generates synthetic TSD PDF fixtures
    "httpx>=0.27",  # test-only: needed for FastAPI's TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
